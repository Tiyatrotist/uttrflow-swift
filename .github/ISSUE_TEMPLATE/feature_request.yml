name: Feature request
description: Something Uttrflow should do and does not
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing before you write: **dictation is on-device and stays that way.**
        Anything requiring a transcript to be sent somewhere is a product decision with a
        privacy page attached, not a feature request — it will not be declined rudely, but
        it will not be quick.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        The problem, not the solution. "I have to retype the same address every day" tells
        us more than "add snippets", because there may be a better answer than the one you
        had in mind.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you had in mind
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Publication note.** What you write here is published as part of the issue.
        Describe the capability or workflow in your own words — "a separate text-expansion
        tool", "typing by hand", "a terminal pasteboard utility" — and leave names,
        screenshots, links, pricing, quotes and any other identifying detail of another
        product out of it. The repository's disclosure rule applies to issues as well as
        to commits and pull requests, and a contributor well ahead of the maintainer is the
        one who reaches the rule.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: |
        The capability or workflow you reach for. Generic descriptions are welcome; naming
        another product — or quoting, screenshotting, linking or pricing one — is not.
    validations:
      required: false